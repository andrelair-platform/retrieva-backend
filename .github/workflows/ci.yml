# =============================================================================
# Continuous Integration — retrieva-backend (L0 lint/types + L1 unit + L2 integration)
# =============================================================================
# The vitest suite is the safety net for the JS->TS migration (RTV-21..24); it
# must stay green from the split forward. Postgres/Drizzle only (Mongo removed at
# RTV-49); integration tests also use @testcontainers/postgresql (Docker on the runner).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '*.md'
      - 'bmad/**'
  pull_request:
    branches: [main]
  workflow_call:

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6378:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine   # dev/prod parity (12-factor #10) — prod is CNPG 17
        env:
          POSTGRES_USER: retrieva
          POSTGRES_PASSWORD: retrieva
          POSTGRES_DB: retrieva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrieva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck (strict, allowJs:false — RTV-25 folded)
        run: npm run typecheck

      # RTV-40 clause→control mapping regression gate — deterministic (no LLM, no DB), so it runs
      # here fail-fast: a library-pattern edit that degrades mapping precision/recall fails the build.
      - name: Clause→control mapping eval gate
        run: npm run evaluate:clause-mapping

      - name: Unit + integration tests
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://retrieva:retrieva@localhost:5432/retrieva_test
          REDIS_URL: redis://localhost:6378
          REDIS_HOST: localhost
          REDIS_PORT: 6378
          JWT_ACCESS_SECRET: test-access-secret-key-that-is-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-that-is-at-least-32-characters-long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: retrieva-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Schema docs drift-check: the committed ERD must match the Drizzle migrations ──
  # Applies db/migrations/*.sql (Drizzle-generated raw SQL) to an EPHEMERAL Postgres, then
  # reverse-engineers docs/data-model with the digest-pinned tbls and fails if it drifted. Same
  # source of truth as prod (the committed migrations — cert defensibility evidence). "Docs can't lie."
  # Pattern + determinism gotchas: schema-erd.md / developer-platform/schema-erd-autogenerated
  # (ref impls ktayl-core/claims/underwriting/iam/policy-service). public schema; Drizzle's
  # drizzle.__drizzle_migrations table excluded via .tbls.yml.
  # PINNED: postgres:17.4 (tbls embeds database_version) + x86_64 baseline + tbls digest + explicit flags.
  schema-erd-drift:
    name: Schema ERD drift-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: retrieva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: pw
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/retrieva?sslmode=disable"
      TBLS_IMAGE: ghcr.io/k1low/tbls@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79
    steps:
      - uses: actions/checkout@v5
      - name: Apply Drizzle SQL migrations to the ephemeral DB
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          for f in $(ls db/migrations/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h localhost -U postgres -d retrieva -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: ERD drift-check (regenerate from migrations, fail if committed docs are stale)
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            "$TBLS_IMAGE" doc -t mermaid --sort -j "$TBLS_DSN" docs/data-model --force
          if ! git diff --quiet -- docs/data-model; then
            echo "::error::docs/data-model drifted from the Drizzle migrations — regenerate + commit the ERD."
            git --no-pager diff -- docs/data-model | head -80
            exit 1
          fi
          echo "✅ ERD docs are in sync with the migrations"

  ci-success:
    name: CI Success
    needs: [test, docker-build, schema-erd-drift]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          ERD_RESULT: ${{ needs.schema-erd-drift.result }}
        run: |
          fail=0
          for name in TEST DOCKER ERD; do
            var="${name}_RESULT"; r="${!var}"
            if [[ "$r" != "success" ]]; then echo "$name job did not pass (result=$r)"; fail=1; fi
          done
          [[ $fail -eq 0 ]] && echo "All CI checks passed." || exit 1
